name: Build and release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.0.0, the release is tagged v<version>)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
            echo "TAG_NAME=v${{ inputs.version }}" >> $GITHUB_ENV
          else
            VERSION_NAME=${GITHUB_REF_NAME#v}
            echo "VERSION=$VERSION_NAME" >> $GITHUB_ENV
            echo "TAG_NAME=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Build debug and release APKs
        run: >
          ./gradlew --no-daemon assembleDebug assembleRelease
          "-PappVersionName=$VERSION"
          "-PappVersionCode=$GITHUB_RUN_NUMBER"

      - name: APK sizes
        run: ls -l app/build/outputs/apk/*/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG_NAME"
          app/build/outputs/apk/release/SilentANR-release.apk
          app/build/outputs/apk/debug/SilentANR-debug.apk
          --title "Silent ANR $VERSION"
          --notes "Install SilentANR-release.apk. SilentANR-debug.apk is the unminified build."
          --target "$GITHUB_SHA" || gh release upload "$TAG_NAME" app/build/outputs/apk/release/SilentANR-release.apk app/build/outputs/apk/debug/SilentANR-debug.apk --clobber
