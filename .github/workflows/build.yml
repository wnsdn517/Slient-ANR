name: Build and release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (the release is tagged v<version>)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        env:
          VERSION: ${{ inputs.version }}
        run: >
          ./gradlew --no-daemon assembleDebug assembleRelease
          "-PappVersionName=$VERSION"
          "-PappVersionCode=$GITHUB_RUN_NUMBER"

      - name: APK sizes
        run: ls -l app/build/outputs/apk/*/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >
          gh release create "v$VERSION"
          app/build/outputs/apk/release/SilentANR-release.apk
          app/build/outputs/apk/debug/SilentANR-debug.apk
          --title "Silent ANR $VERSION"
          --notes "Install SilentANR-release.apk. SilentANR-debug.apk is the unminified build."
          --target "$GITHUB_SHA"
