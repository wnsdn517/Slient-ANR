name: Build and release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.0.2, tagged as v1.0.2)"
        required: true
        default: "1.0.2"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine Version & Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
            TAG="v${VER}"
          else
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          fi
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG}" >> $GITHUB_OUTPUT

      - name: Build debug and release APKs
        run: >
          ./gradlew --no-daemon assembleDebug assembleRelease
          "-PappVersionName=${{ steps.vars.outputs.VERSION }}"
          "-PappVersionCode=${{ github.run_number }}"

      - name: Check Built APKs
        run: ls -l app/build/outputs/apk/*/*.apk

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: Silent ANR ${{ steps.vars.outputs.VERSION }}
          body: "Install SilentANR-release.apk. SilentANR-debug.apk is the unminified build."
          files: |
            app/build/outputs/apk/release/SilentANR-release.apk
            app/build/outputs/apk/debug/SilentANR-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
